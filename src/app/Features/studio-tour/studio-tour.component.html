<section class="w-full py-16 md:py-24 bg-brand-tertiary/95">
  <div class="container mx-auto px-4 max-w-desktop">
    <div class="flex flex-col lg:flex-row items-center gap-12">
      <!-- Content Side -->
      <div class="w-full lg:w-1/2 flex flex-col items-start text-brand-primary">
        <app-section-header
          [title]="'STUDIO_TOUR.TAG' | translate"
          [subtitle]="
            ('STUDIO_TOUR.TITLE_PART1' | translate) +
            '<br/><span class=\'text-brand-quaternary\'>' +
            ('STUDIO_TOUR.TITLE_PART2' | translate) +
            '</span>'
          "
          size="medium"
        ></app-section-header>

        <p class="text-brand-primary/70 text-lg leading-relaxed mb-8 max-w-xl">
          {{ 'STUDIO_TOUR.DESCRIPTION' | translate }}
        </p>

        <app-action-button
          [text]="'STUDIO_TOUR.WATCH_ON_YOUTUBE' | translate"
          [icon]="'youtube'"
          color="secondary"
          size="large"
          [link]="watchUrl"
        ></app-action-button>
      </div>

      <!-- Video Side -->
      <div
        class="relative w-full lg:w-1/2 aspect-video rounded-[40px] overflow-hidden shadow-2xl bg-brand-primary"
      >
        @if (!showVideo()) {
          <div
            (click)="playVideo()"
            class="relative w-full h-full group cursor-pointer animate-fade-in"
          >
            <img
              [src]="thumbnailurl"
              alt="Radio Studio Tour"
              class="w-full h-full object-cover transition-transform duration-500 group-hover:scale-105"
            />

            <!-- Overlay -->
            <div
              class="absolute inset-0 bg-brand-primary/20 group-hover:bg-brand-primary/10 transition-colors duration-300"
            ></div>

            <!-- Play Button -->
            <div class="absolute inset-0 flex items-center justify-center">
              <div
                class="w-20 h-20 bg-brand-quinary rounded-full flex items-center justify-center shadow-2xl transform transition-transform duration-300 group-hover:scale-110"
              >
                <svg-icon
                  name="play"
                  [applyClass]="true"
                  class="w-8 h-8 fill-brand-primary"
                ></svg-icon>
              </div>
            </div>

            <!-- Label -->
            <div
              class="absolute bottom-8 left-8 bg-brand-tertiary/90 backdrop-blur-md border border-brand-primary/10 rounded-2xl px-6 py-3"
            >
              <p class="text-brand-primary font-bold text-sm tracking-wide">
                {{ 'STUDIO_TOUR.VIDEO_LABEL' | translate }}
              </p>
            </div>
          </div>
        } @else {
          <iframe
            [src]="videoEmbedUrl()"
            class="w-full h-full"
            frameborder="0"
            allow="
              accelerometer;
              autoplay;
              clipboard-write;
              encrypted-media;
              gyroscope;
              picture-in-picture;
              web-share;
            "
            referrerpolicy="strict-origin-when-cross-origin"
            allowfullscreen
          ></iframe>
        }
      </div>
    </div>
  </div>
</section>

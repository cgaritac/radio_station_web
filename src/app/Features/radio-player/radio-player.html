<div class="w-full px-4">
  <div class="grid grid-cols-3 items-center max-w-desktop mx-auto w-full">
    <div class="justify-self-start">
      <p class="flex items-center gap-2 text-sm font-bold">
        <span class="text-brand-secondary" [class.animate-pulse]="radioService.isPlaying()" i18n
          >Live:</span
        >{{ radioService.trackInfo().title }}
      </p>
      @if (radioService.trackInfo().title) {
        <p class="text-xs text-brand-sextary">
          {{ radioService.trackInfo().artist }}
        </p>
      }
    </div>
    <div class="flex flex-col items-center gap-2 justify-self-center">
      @if (radioService.isPlaying()) {
        <button
          (click)="radioService.togglePlay()"
          class="w-14 h-14 flex items-center justify-center bg-brand-primary/60 hover:bg-brand-primary/30 rounded-full transition-colors animate-shadow-pulse cursor-pointer"
        >
          <svg-icon
            name="stop"
            class="w-10 h-10 text-brand-secondary hover:text-brand-secondary/80"
          ></svg-icon>
        </button>
      } @else {
        <button
          (click)="radioService.togglePlay()"
          class="w-14 h-14 flex items-center justify-center bg-brand-primary/60 hover:bg-brand-primary/30 rounded-full transition-colors cursor-pointer"
        >
          <svg-icon
            name="play"
            class="w-10 h-10 text-brand-secondary hover:text-brand-secondary/80 ml-1"
          ></svg-icon>
        </button>
      }
      <div class="text-xs text-brand-secondary flex items-center gap-2">
        @if (radioService.isPlaying()) {
          <span class="w-2 h-2 bg-brand-quaternary rounded-full animate-pulse"></span>
        }
        <p>
          @if (radioService.isPlaying()) {
            <ng-container i18n>Streaming</ng-container>
          } @else {
            <ng-container i18n>Live Streaming</ng-container>
          }
        </p>
      </div>
    </div>
    <div class="flex items-center gap-2 justify-self-end">
      <svg-icon
        [name]="radioService.isMuted() || radioService.volume() === 0 ? 'mute' : 'volume'"
        [class]="
          radioService.isMuted() || radioService.volume() === 0
            ? 'text-brand-quinary hover:text-brand-quinary/80 transition-colors'
            : 'text-brand-secondary hover:text-brand-secondary/80 transition-colors'
        "
        class="w-6 h-6 cursor-pointer"
        (click)="radioService.toggleMute()"
      ></svg-icon>
      <input
        type="range"
        min="0"
        max="10"
        [value]="radioService.volume()"
        (input)="radioService.setVolume(vol.valueAsNumber)"
        #vol
        class="w-24 h-1 rounded-full cursor-pointer appearance-none"
        [style.background-image]="
          'linear-gradient(to right, var(--color-brand-secondary) 0%, var(--color-brand-secondary) ' +
          radioService.volume() * 10 +
          '%, transparent ' +
          radioService.volume() * 10 +
          '%, transparent 100%)'
        "
      />
    </div>
  </div>
</div>

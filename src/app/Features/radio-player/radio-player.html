<div class="w-full px-4 py-4 sm:py-0">
  <div
    class="grid grid-cols-1 sm:grid-cols-3 items-center max-w-desktop mx-auto w-full gap-6 sm:gap-0"
  >
    <!-- Track Info -->
    <div
      class="justify-self-center sm:justify-self-start bg-brand-primary/20 py-1.5 px-5 rounded-2xl min-h-[40px] max-w-[280px] sm:max-w-[250px] w-full flex flex-col justify-center text-center sm:text-left order-1 sm:order-0"
    >
      @if (radioService.trackInfo().title || radioService.trackInfo().artist) {
        <p
          class="flex items-center justify-center sm:justify-start gap-2 text-sm font-bold w-full overflow-hidden"
        >
          <span
            class="text-brand-secondary shrink-0"
            [class.animate-pulse]="radioService.isPlaying()"
          >
            {{ 'PLAYER.LIVE' | translate }}
          </span>
          <span class="truncate" [attr.title]="radioService.trackInfo().title">
            {{ radioService.trackInfo().title }}
          </span>
        </p>
        <p
          class="text-xs text-brand-tertiary truncate w-full"
          [attr.title]="radioService.trackInfo().artist"
        >
          {{ radioService.trackInfo().artist }}
        </p>
      } @else {
        <div class="space-y-2 py-1">
          <div class="flex items-center justify-center sm:justify-start gap-2">
            <div class="h-3.5 w-10 skeleton"></div>
            <div class="h-3.5 w-32 skeleton"></div>
          </div>
          <div class="h-2.5 w-20 skeleton opacity-40 mx-auto sm:ml-12"></div>
        </div>
      }
    </div>

    <!-- Play Button -->
    <div class="flex flex-col items-center gap-2 justify-self-center order-2 sm:order-0">
      @if (radioService.isPlaying()) {
        <button
          (click)="radioService.togglePlay()"
          class="w-14 h-14 flex items-center justify-center bg-brand-primary/60 hover:bg-brand-primary/30 rounded-full transition-colors animate-shadow-pulse cursor-pointer"
        >
          <svg-icon
            name="stop"
            class="w-10 h-10 text-brand-secondary hover:text-brand-secondary/80"
          ></svg-icon>
        </button>
      } @else {
        <button
          (click)="radioService.togglePlay()"
          class="w-14 h-14 flex items-center justify-center bg-brand-primary/60 hover:bg-brand-primary/30 hover:shadow-lg hover:shadow-brand-quaternary/50 rounded-full transition-colors cursor-pointer"
        >
          <svg-icon
            name="play"
            class="w-10 h-10 text-brand-secondary hover:text-brand-secondary/80 ml-1"
          ></svg-icon>
        </button>
      }
    </div>

    <!-- Volume -->
    <div
      class="flex items-center bg-brand-primary/20 py-1 px-2.5 rounded-full gap-2 justify-self-center sm:justify-self-end order-3 sm:order-0"
    >
      <svg-icon
        [name]="radioService.isMuted() || radioService.volume() === 0 ? 'mute' : 'volume'"
        [class]="
          radioService.isMuted() || radioService.volume() === 0
            ? 'text-brand-quinary hover:text-brand-quinary/80 transition-colors'
            : 'text-brand-secondary hover:text-brand-secondary/80 transition-colors'
        "
        class="w-6 h-6 cursor-pointer"
        (click)="radioService.toggleMute()"
      ></svg-icon>
      <input
        type="range"
        min="0"
        max="10"
        [value]="radioService.volume()"
        (input)="radioService.setVolume(vol.valueAsNumber)"
        #vol
        class="w-24 h-1 rounded-full cursor-pointer appearance-none"
        [style.background-image]="
          'linear-gradient(to right, var(--color-brand-secondary) 0%, var(--color-brand-secondary) ' +
          radioService.volume() * 10 +
          '%, transparent ' +
          radioService.volume() * 10 +
          '%, transparent 100%)'
        "
      />
    </div>
  </div>
</div>

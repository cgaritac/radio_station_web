<section class="w-full py-24 bg-brand-tertiary/95">
  <div class="max-w-desktop mx-auto px-4">
    <div class="flex flex-col gap-8 mb-16">
      <app-section-header
        [title]="'ABOUT_US.TEAM_TITLE' | translate"
        [subtitle]="'ABOUT_US.TEAM_SUBTITLE' | translate"
        [centered]="true"
      ></app-section-header>
    </div>

    <div class="grid grid-cols-1 md:grid-cols-3 gap-12">
      @for (member of team(); track member.name) {
        <div class="group">
          <div
            class="relative overflow-hidden rounded-[32px] aspect-4/5 mb-6 shadow-xl border border-brand-primary/5"
          >
            <img
              [src]="member.image"
              [alt]="member.name"
              class="w-full h-full object-cover group-hover:scale-110 transition-transform duration-700"
            />
            <div
              class="absolute inset-0 bg-linear-to-t from-brand-primary/80 via-transparent to-transparent opacity-0 group-hover:opacity-100 transition-opacity duration-500"
            ></div>
          </div>
          <h4 class="text-2xl font-bold text-brand-primary text-center mb-1">
            {{ member.name | translate }}
          </h4>
          <p class="text-brand-secondary font-bold text-center text-sm uppercase tracking-widest">
            {{ member.role | translate }}
          </p>
        </div>
      }
    </div>
  </div>
</section>

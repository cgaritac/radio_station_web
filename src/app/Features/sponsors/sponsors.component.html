<section class="w-full py-16 md:py-24 bg-brand-tertiary/95">
  <div class="container mx-auto px-4 max-w-desktop">
    <!-- Header -->
    <div class="mb-12">
      <app-section-header
        [title]="'SPONSORS.TAG' | translate"
        [subtitle]="'SPONSORS.TITLE' | translate"
        [centered]="true"
      ></app-section-header>
    </div>

    <div class="grid grid-cols-2 md:grid-cols-5 gap-6 md:gap-8">
      @for (sponsor of sponsors(); track sponsor.name) {
        <a
          [href]="sponsor.link"
          target="_blank"
          class="group relative flex flex-col items-center justify-center p-8 border border-brand-primary/5 rounded-3xl transition-all duration-300 hover:scale-[1.05] shadow-sm hover:shadow-xl"
          [ngClass]="{
            'border-dashed border-brand-primary/10 bg-brand-primary/2': sponsor.logo === 'cta',
            'bg-brand-primary': sponsor.name === cgc_sponsor,
            'bg-brand-tertiary hover:bg-brand-primary/2':
              sponsor.name !== cgc_sponsor && sponsor.logo !== 'cta',
          }"
        >
          <div
            class="relative z-10 w-full aspect-square flex items-center justify-center transition-all duration-500 mb-4"
            [class.grayscale]="sponsor.logo === 'images/sponsor_placeholder.png'"
            [class.group-hover:grayscale-0]="sponsor.logo === 'images/sponsor_placeholder.png'"
          >
            @if (sponsor.logo === 'cta') {
              <div class="text-center">
                <span class="text-brand-secondary text-2xl font-black block leading-tight">+</span>
              </div>
            } @else if (sponsor.logo.startsWith('icon:')) {
              <div
                class="w-16 h-16 bg-brand-primary/10 rounded-2xl flex items-center justify-center"
              >
                <svg-icon
                  [name]="sponsor.logo.split(':')[1]"
                  class="w-10 h-10 text-brand-primary"
                ></svg-icon>
              </div>
            } @else if (sponsor.logo === 'images/sponsor_placeholder.png') {
              <div
                class="w-16 h-16 bg-brand-primary/5 rounded-full flex items-center justify-center"
              >
                <span class="text-brand-primary/20 text-2xl font-bold">{{
                  sponsor.name.charAt(0)
                }}</span>
              </div>
            } @else {
              <div
                class="w-full h-full bg-contain bg-center bg-no-repeat"
                [style.backgroundImage]="'url(' + sponsor.logo + ')'"
                [attr.aria-label]="sponsor.name"
              ></div>
            }
          </div>

          <!-- label -->
          <span
            class="text-[10px] font-bold tracking-widest uppercase text-center block"
            [ngClass]="{
              'text-brand-secondary': sponsor.name === cgc_sponsor,
              'text-brand-primary': sponsor.name !== cgc_sponsor,
            }"
          >
            {{ sponsor.name | translate }}
          </span>
        </a>
      }
    </div>
  </div>
</section>

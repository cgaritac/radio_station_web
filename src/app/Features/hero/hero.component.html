<section class="relative w-full h-[760px] overflow-hidden bg-brand-primary">
  <div class="absolute inset-0 bg-brand-primary">
    <img
      src="images/home_hero.png"
      alt="People praying together in a community gathering"
      class="w-full h-full object-cover animate-fade-in"
      loading="eager"
      fetchpriority="high"
    />
    <div
      class="absolute inset-0 bg-linear-to-t from-brand-primary/90 via-brand-primary/70 to-brand-primary/50"
    ></div>
  </div>

  <div
    class="relative z-10 container mx-auto px-4 h-full flex flex-col justify-center items-start text-brand-tertiary"
  >
    @if(radioService.isPlaying()) {
      <div class="flex items-center gap-x-2 bg-brand-secondary/15 border border-brand-secondary/35 rounded-full px-3 py-1.5 mb-4">
        <span class="h-2 w-2 bg-brand-secondary rounded-full animate-pulse"></span> 
        <span class="text-brand-secondary text-xs font-semibold tracking-wider animate-pulse">{{ 'HERO.STREAMING' | translate }}</span>        
      </div>
    }
    @else {
      <span class="h-7.5 mb-4"></span>
    }
    <h1 class="text-4xl md:text-6xl font-bold mb-4 drop-shadow-lg">
      {{ 'HERO.TEXT1' | translate }} <br />
      <span class="text-brand-secondary">{{ 'HERO.TEXT2' | translate }}</span>
      {{ 'HERO.TEXT3' | translate }}
      <span class="text-brand-secondary">{{ 'HERO.TEXT4' | translate }}</span>
    </h1>
    <p class="text-lg md:text-xl text-gray-200 mb-8 max-w-2xl drop-shadow-md">
      {{ 'HERO.SUBTITLE' | translate }}
    </p>
    <div class="flex flex-col gap-y-4 md:flex-row md:gap-4">
      @if(radioService.isPlaying()) {
        <app-action-button
          [text]="'HERO.STOP' | translate"
          [icon]="'stop'"
          color="secondary"
          size="large"
          (click)="radioService.togglePlay()"
        ></app-action-button>
      } @else {
        <app-action-button
          [text]="'HERO.LISTEN_NOW' | translate"
          [icon]="'play'"
          color="secondary"
          size="large"
          (click)="radioService.togglePlay()"
        ></app-action-button>
      }
      <app-action-button
        [text]="'HERO.YOUTUBE' | translate"
        [icon]="'youtube'"
        color="tertiary"
        size="large"
        link="https://www.youtube.com/@radioornannandayure"
      ></app-action-button>
    </div>
  </div>
</section>

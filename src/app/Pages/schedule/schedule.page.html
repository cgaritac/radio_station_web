<div class="pt-20">
  <!-- Hero Section -->
  <section class="w-full py-20 md:py-32 bg-brand-tertiary">
    <div class="max-w-desktop mx-auto px-4">
      <div class="flex flex-col items-center text-center max-w-4xl mx-auto">
        <app-section-header
          id="schedule-header"
          [title]="'SCHEDULE_PAGE.TITLE' | translate"
          [subtitle]="'SCHEDULE_PAGE.SUBTITLE' | translate"
          [centered]="true"
          size="large"
        ></app-section-header>
      </div>
    </div>
  </section>

  <!-- Content Section -->
  <section class="w-full py-24 bg-brand-tertiary/95">
    <div class="max-w-desktop mx-auto px-4 md:px-8">
      <!-- Week Tabs -->
      <app-schedule-tabs
        [weeks]="weeks()"
        [activeId]="activeTab()"
        (tabChange)="setTab($event)"
      ></app-schedule-tabs>

      <!-- Schedule Card -->
      <app-schedule-card
        [week]="currentWeek()"
        [radioName]="radioService.radioName()"
      ></app-schedule-card>

      <!-- Footer Info -->
      <div class="mt-20 flex flex-col items-center gap-6">
        <div class="w-20 h-1 bg-brand-primary/10 rounded-full"></div>
        <p
          class="text-brand-primary/40 font-bold uppercase tracking-[0.3em] text-[10px] text-center max-w-md leading-relaxed"
        >
          {{ 'SCHEDULE_PAGE.NOTE' | translate }}
        </p>
      </div>
    </div>
  </section>
</div>

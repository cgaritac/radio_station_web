<div class="pt-20">
  <!-- Hero Section -->
  <section class="w-full py-20 md:py-32 bg-brand-tertiary/95">
    <div class="max-w-desktop mx-auto px-4">
      <div class="flex flex-col items-center text-center max-w-4xl mx-auto">
        <app-section-header
          [title]="heroTitle()"
          [subtitle]="'STUDIES_PAGE.SUBTITLE' | translate"
          [centered]="true"
          size="large"
        ></app-section-header>
      </div>
    </div>
  </section>

  <!-- Studies List Section -->
  <section class="w-full py-24 bg-brand-tertiary/90">
    <div class="max-w-desktop mx-auto px-4 md:px-8">
      <!-- Category Selection -->
      <app-category-filter
        basePath="/studies"
        [categories]="categories()"
        [selectedSlug]="selectedCategorySlug() || 'all'"
        allLabel="STUDIES_PAGE.CATEGORIES.ALL"
      ></app-category-filter>

      <!-- Studies List -->
      <app-studies-list [items]="filteredStudies()"></app-studies-list>
    </div>
  </section>

  <!-- Advertise Banner -->
  <app-advertise-banner></app-advertise-banner>
</div>

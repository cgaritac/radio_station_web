<div class="pt-20">
  <!-- Hero Section -->
  <app-page-hero
    [title]="'CONTACT.TITLE' | translate"
    [subtitle]="'CONTACT.SUBTITLE' | translate"
  ></app-page-hero>

  <!-- Contact Section -->
  <section class="w-full py-24 bg-brand-tertiary/90 border-y border-brand-primary/5">
    <div class="max-w-desktop mx-auto px-4 md:px-8">
      <div class="flex flex-col lg:flex-row gap-16">
        <!-- Info & Socials Column -->
        <div class="w-full lg:w-1/3">
          <app-contact-info></app-contact-info>
          <app-social-links></app-social-links>
        </div>

        <!-- Form Column -->
        <div class="w-full lg:w-2/3">
          <app-contact-form></app-contact-form>
        </div>
      </div>
    </div>
  </section>

  <!-- Map Section -->
  <app-location-map></app-location-map>
</div>

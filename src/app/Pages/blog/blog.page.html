<div class="pt-20">
  <!-- Hero Section -->
  <app-page-hero
    [title]="heroTitle()"
    [subtitle]="'BLOG_PAGE.SUBTITLE' | translate"
  ></app-page-hero>

  <!-- Blog Posts Section -->
  <section class="w-full py-24 bg-brand-tertiary/90">
    <div class="max-w-desktop mx-auto px-4 md:px-8">
      <!-- Category Selection -->
      <app-category-filter
        basePath="/blog"
        [categories]="categories()"
        [selectedSlug]="selectedCategorySlug() || 'all'"
        allLabel="BLOG_PAGE.CATEGORIES.ALL"
      ></app-category-filter>

      <!-- Blog List -->
      <app-blog-list [items]="filteredPosts()"></app-blog-list>
    </div>
  </section>

  <!-- Advertise Banner -->
  <app-advertise-banner></app-advertise-banner>
</div>

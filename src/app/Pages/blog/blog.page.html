<div class="pt-20">
  <!-- Hero Section -->
  <app-page-hero
    [title]="'BLOG_PAGE.TITLE' | translate"
    [subtitle]="'BLOG_PAGE.SUBTITLE' | translate"
  ></app-page-hero>

  <!-- Blog Posts Section -->
  <section class="w-full py-24 bg-brand-tertiary/90 border-y border-brand-primary/5">
    <div class="max-w-desktop mx-auto px-4 md:px-8">
      <div class="flex flex-col gap-16">
        @for (post of blogPosts(); track post.id) {
          <article class="grid grid-cols-1 lg:grid-cols-2 gap-12 items-center group">
            <!-- Image Area -->
            <a
              [routerLink]="['/blog', post.id]"
              class="relative block overflow-hidden rounded-[40px] aspect-video lg:aspect-square shadow-2xl shadow-brand-primary/5 border border-brand-primary/5 group"
            >
              <img
                [src]="post.image"
                [alt]="post.title | translate"
                class="w-full h-full object-cover group-hover:scale-105 transition-transform duration-1000"
              />
              <div
                class="absolute inset-0 bg-linear-to-t from-brand-primary/40 to-transparent"
              ></div>
            </a>

            <!-- Content Area -->
            <div class="flex flex-col gap-6">
              <div class="flex items-center gap-4">
                <span
                  class="px-4 py-1.5 bg-brand-primary/5 text-brand-secondary text-xs font-black uppercase tracking-widest rounded-full border border-brand-secondary/10"
                >
                  {{ post.category | translate }}
                </span>
                <span class="w-1.5 h-1.5 rounded-full bg-brand-primary/10"></span>
                <span class="text-xs font-bold text-brand-primary/40 uppercase tracking-widest">
                  {{ 'BLOG_PAGE.AUTHOR' | translate }} {{ post.author }}
                </span>
              </div>

              <a [routerLink]="['/blog', post.id]">
                <h3
                  class="text-3xl md:text-4xl font-black text-brand-primary leading-tight hover:text-brand-secondary transition-colors duration-300"
                >
                  {{ post.title | translate }}
                </h3>
              </a>

              <p class="text-brand-primary/60 text-lg leading-relaxed line-clamp-3">
                {{ post.excerpt | translate }}
              </p>

              <div class="pt-4">
                <a
                  [routerLink]="['/blog', post.id]"
                  class="inline-flex items-center gap-4 group/btn cursor-pointer"
                >
                  <div
                    class="w-12 h-12 rounded-full bg-brand-secondary flex items-center justify-center text-brand-primary shadow-lg shadow-brand-secondary/20 group-hover/btn:scale-110 transition-all"
                  >
                    <svg-icon name="arrow-right" class="w-5 h-5"></svg-icon>
                  </div>
                  <span class="font-black text-xs uppercase tracking-widest text-brand-primary">
                    {{ 'BLOG_PAGE.READ_ARTICLE' | translate }}
                  </span>
                </a>
              </div>
            </div>
          </article>
        }
      </div>
    </div>
  </section>

  <!-- Advertise Banner -->
  <app-advertise-banner></app-advertise-banner>
</div>

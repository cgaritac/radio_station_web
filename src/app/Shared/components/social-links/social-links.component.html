<div class="mt-4">
  <p class="text-xs font-bold text-brand-primary/40 uppercase tracking-widest mb-6 ml-1">
    {{ 'CONTACT.FOLLOW_US' | translate }}
  </p>
  <div class="flex gap-4">
    <a
      [href]="'SOCIAL.FACEBOOK' | translate"
      target="_blank"
      rel="noopener noreferrer"
      class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-brand-primary hover:bg-brand-secondary hover:scale-110 transition-all border border-brand-primary/5"
    >
      <svg-icon name="facebook" class="w-5 h-5"></svg-icon>
    </a>
    <a
      [href]="'SOCIAL.INSTAGRAM' | translate"
      target="_blank"
      rel="noopener noreferrer"
      class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-brand-primary hover:bg-brand-secondary hover:scale-110 transition-all border border-brand-primary/5"
    >
      <svg-icon name="instagram" class="w-5 h-5"></svg-icon>
    </a>
    <a
      [href]="'SOCIAL.YOUTUBE' | translate"
      target="_blank"
      rel="noopener noreferrer"
      class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-brand-primary hover:bg-brand-secondary hover:scale-110 transition-all border border-brand-primary/5"
    >
      <svg-icon name="youtube" class="w-5 h-5"></svg-icon>
    </a>
    <a
      [href]="'SOCIAL.TIKTOK' | translate"
      target="_blank"
      rel="noopener noreferrer"
      class="w-12 h-12 bg-white rounded-2xl shadow-sm flex items-center justify-center text-brand-primary hover:bg-brand-secondary hover:scale-110 transition-all border border-brand-primary/5"
    >
      <svg-icon name="tiktok" class="w-5 h-5"></svg-icon>
    </a>
  </div>
</div>

<a
  href="#main-content"
  class="skip-to-content focus:translate-y-0 -translate-y-full transition-transform duration-300 absolute top-0 left-0 bg-brand-secondary text-brand-primary px-4 py-2 z-[100] outline-none font-bold"
>
  {{ 'ACCESSIBILITY.SKIP_TO_CONTENT' | translate }}
</a>

<div class="min-h-screen flex flex-col text-brand-tertiary">
  <header
    class="fixed top-0 w-full z-50 transition-all duration-500 border-b"
    [ngClass]="
      isScrolled
        ? 'bg-brand-primary-light/25 backdrop-blur-md border-brand-tertiary/10 py-1'
        : 'bg-brand-primary/0 backdrop-blur-none border-transparent py-3'
    "
  >
    <app-header />
  </header>

  <main id="main-content" class="grow" tabindex="-1">
    <router-outlet />
  </main>

  <app-footer />
  <div
    class="sticky bottom-0 z-50 border-t border-brand-tertiary/10 bg-brand-primary/35 backdrop-blur-md"
  >
    <app-radio-player />
  </div>
</div>
